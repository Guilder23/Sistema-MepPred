<!-- Modal Crear Examen -->
<div class="modal-crear-overlay" id="modalCrearOverlay">
    <div class="modal-crear-container">
        <div class="modal-crear-header">
            <h2>Crear Nuevo Examen</h2>
            <button class="modal-crear-btn-close" type="button">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-crear-body">
            <form id="formCrearExamen">
                <!-- Título -->
                <div class="modal-crear-form-group modal-crear-required">
                    <label for="crearTitulo">Título del Examen</label>
                    <input 
                        type="text" 
                        class="modal-crear-form-control" 
                        id="crearTitulo" 
                        placeholder="Ej: Examen de Matemáticas"
                        minlength="3"
                        maxlength="150"
                        required>
                </div>

                <!-- Materia -->
                <div class="modal-crear-form-group modal-crear-required">
                    <label for="crearMateria">Materia</label>
                    <select class="modal-crear-form-control" id="crearMateria" onchange="cargarTemasCrearExamen()" required>
                        <option value="">Seleccione una materia</option>
                    </select>
                </div>

                <!-- Tema -->
                <div class="modal-crear-form-group modal-crear-required">
                    <label for="crearTema">Tema</label>
                    <select class="modal-crear-form-control" id="crearTema" required>
                        <option value="">Seleccione un tema</option>
                    </select>
                </div>

                <!-- Descripción -->
                <div class="modal-crear-form-group">
                    <label for="crearDescripcion">Descripción</label>
                    <textarea 
                        class="modal-crear-form-control" 
                        id="crearDescripcion" 
                        placeholder="Descripción opcional..."
                        maxlength="500"
                        rows="3"></textarea>
                </div>

                <!-- Duración -->
                <div class="modal-crear-form-group modal-crear-required">
                    <label for="crearDuracion">Duración (minutos)</label>
                    <input 
                        type="number" 
                        class="modal-crear-form-control" 
                        id="crearDuracion" 
                        value="60" 
                        min="1"
                        max="1440"
                        required>
                </div>

                <!-- Activo -->
                <div class="modal-crear-form-group">
                    <label class="modal-crear-checkbox-label">
                        <input type="checkbox" id="crearActivo" checked>
                        <span>Examen activo</span>
                    </label>
                </div>

                <!-- Nota -->
                <div class="modal-crear-nota">
                    <i class="fas fa-info-circle"></i>
                    <span>Podrás agregar preguntas después de crear el examen</span>
                </div>
            </form>
        </div>

        <div class="modal-crear-footer">
            <button type="button" class="modal-crear-btn modal-crear-btn-cancelar" id="btnCancelarExamen">
                Cancelar
            </button>
            <button type="button" class="modal-crear-btn modal-crear-btn-guardar" id="btnGuardarExamen">
                <i class="fas fa-save"></i> Guardar
            </button>
        </div>
    </div>
</div>
