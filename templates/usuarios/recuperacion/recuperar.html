{% extends 'base/base.html' %}

{% block titulo %}Recuperar contraseña{% endblock %}

{% block css %}
<link rel="stylesheet" href="/static/css/usuarios/recuperacion/recuperar.css" />
{% endblock %}

{% block contenido %}
<section class="card">
  <h1>Recuperar contraseña</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <label>Correo electrónico</label>
    <input type="email" name="email" required />
    <button type="submit">Enviar enlace</button>
  </form>
</section>
{% endblock %}

{% block js %}
<script src="/static/js/usuarios/recuperacion/recuperar.js"></script>
{% endblock %}
