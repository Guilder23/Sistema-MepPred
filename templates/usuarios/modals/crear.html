<!-- Modal Crear Usuario -->
<div class="modal-overlay" id="modalCrearOverlay">
    <div class="modal-content" id="modalCrear">
        <div class="modal-header">
            <h5 class="modal-header-title">Crear Nuevo Usuario</h5>
            <button type="button" class="modal-close-btn" onclick="ocultarModal('modalCrearOverlay')">×</button>
        </div>
        <form id="formCrear" method="POST">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control" name="password2" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Rol</label>
                    <select class="form-select" name="role" required>
                        <option value="">Selecciona un rol</option>
                        <option value="student">Estudiante</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="ocultarModal('modalCrearOverlay')">Cancelar</button>
                <button type="submit" class="btn btn-success">Crear Usuario</button>
            </div>
        </form>
    </div>
</div>
