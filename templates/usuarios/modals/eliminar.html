<!-- Modal Eliminar Usuario -->
<div class="modal-overlay" id="modalEliminarOverlay">
    <div class="modal-content" id="modalEliminar">
        <div class="modal-header">
            <h5 class="modal-header-title">Eliminar Usuario</h5>
            <button type="button" class="modal-close-btn" onclick="ocultarModal('modalEliminarOverlay')">×</button>
        </div>
        <div class="modal-body">
            <p>¿Estás seguro de que deseas eliminar al usuario <strong id="eliminarNombre"></strong>?</p>
            <p class="text-danger"><small>Esta acción no se puede deshacer.</small></p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="ocultarModal('modalEliminarOverlay')">Cancelar</button>
            <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar Usuario</button>
        </div>
    </div>
</div>
