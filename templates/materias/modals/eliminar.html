<!-- Modal Eliminar Materia -->
<div class="modal-eliminar-overlay" id="modalEliminarOverlay">
    <div class="modal-eliminar-container">
        <div class="modal-eliminar-header">
            <h2>Eliminar Materia</h2>
            <button type="button" class="modal-eliminar-btn-close">&times;</button>
        </div>
        <div class="modal-eliminar-body">
            <div class="modal-eliminar-warning-icon">⚠️</div>
            <div class="modal-eliminar-warning-text">
                ¿Está seguro que desea eliminar esta materia?
                <strong id="nombreMateriaEliminar">-</strong>
                <span>Esta acción no se puede deshacer.</span>
            </div>
            <input type="hidden" id="idMateriaEliminar">
        </div>
        <div class="modal-eliminar-footer">
            <button type="button" class="modal-eliminar-btn modal-eliminar-btn-cancelar" id="btnCancelarEliminarMateria">Cancelar</button>
            <button type="button" class="modal-eliminar-btn modal-eliminar-btn-eliminar" id="btnEliminarMateria">Eliminar</button>
        </div>
    </div>
</div>
