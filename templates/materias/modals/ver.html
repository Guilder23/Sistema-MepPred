<!-- Modal Ver Materia -->
<div class="modal-ver-overlay" id="modalVerOverlay">
    <div class="modal-ver-container">
        <div class="modal-ver-header">
            <h2>Detalles de la Materia</h2>
            <button type="button" class="modal-ver-btn-close">&times;</button>
        </div>
        <div class="modal-ver-body">
            <div class="modal-ver-info-row">
                <div class="modal-ver-info-label">Nombre</div>
                <div class="modal-ver-info-value" id="verNombre">-</div>
            </div>
            <div class="modal-ver-info-row">
                <div class="modal-ver-info-label">Descripción</div>
                <div class="modal-ver-info-value" id="verDescripcion">-</div>
            </div>
            <div class="modal-ver-info-row">
                <div class="modal-ver-info-label">Fecha de Creación</div>
                <div class="modal-ver-info-value" id="verFechaCreacion">-</div>
            </div>
            <div class="modal-ver-info-row">
                <div class="modal-ver-info-label">Última Actualización</div>
                <div class="modal-ver-info-value" id="verFechaActualizacion">-</div>
            </div>
        </div>
        <div class="modal-ver-footer">
            <button type="button" class="modal-ver-btn modal-ver-btn-cerrar" id="btnCerrarVer">Cerrar</button>
        </div>
    </div>
</div>
