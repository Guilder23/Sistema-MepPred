<div id="modal-crear-mazo" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Crear Nuevo Mazo</h3>
            <span class="close">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="crear-mazo-nombre">Nombre del mazo:</label>
                <input type="text" id="crear-mazo-nombre" placeholder="Nombre del mazo..." required>
            </div>
            <div class="form-group">
                <label for="crear-mazo-desc">Descripción:</label>
                <textarea id="crear-mazo-desc" placeholder="Descripción (opcional)..." style="max-height: 80px;"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelar-crear-mazo">Cancelar</button>
            <button class="btn btn-primary" id="guardar-crear-mazo">Crear Mazo</button>
        </div>
    </div>
</div>
