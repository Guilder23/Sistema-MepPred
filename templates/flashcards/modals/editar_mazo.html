<div id="modal-editar-mazo" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Editar Mazo</h3>
            <span class="close">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="edit-mazo-nombre">Nombre:</label>
                <input type="text" id="edit-mazo-nombre" required>
            </div>
            <div class="form-group">
                <label for="edit-mazo-desc">Descripción:</label>
                <textarea id="edit-mazo-desc"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelar-editar">Cancelar</button>
            <button class="btn btn-primary" id="guardar-editar">Guardar Cambios</button>
        </div>
    </div>
</div>
