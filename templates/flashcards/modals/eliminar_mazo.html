<div id="modal-eliminar-mazo" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Eliminar Mazo</h3>
            <span class="close">&times;</span>
        </div>
        <div class="modal-body">
            <div class="warning-message">
                <i class="fas fa-exclamation-triangle"></i>
                <p>¿Estás seguro de que deseas eliminar el mazo <strong id="eliminar-mazo-nombre"></strong>?</p>
                <p class="warning-text">Esta acción no se puede deshacer.</p>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelar-eliminar-mazo">Cancelar</button>
            <button class="btn btn-danger" id="confirmar-eliminar-mazo">Eliminar</button>
        </div>
    </div>
</div>
