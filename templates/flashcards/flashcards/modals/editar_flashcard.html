<div id="modal-editar-flashcard" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Editar Flashcard</h3>
            <span class="close">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="editar-flashcard-categoria">Categoría:</label>
                <input type="text" id="editar-flashcard-categoria" placeholder="Ej: Programación, Historia, Inglés...">
            </div>
            <div class="form-group">
                <label for="editar-flashcard-pregunta">Pregunta/Frente:</label>
                <textarea id="editar-flashcard-pregunta" placeholder="Escribe la pregunta o concepto aquí..." required></textarea>
            </div>
            <div class="form-group">
                <label for="editar-flashcard-respuesta">Respuesta/Reverso:</label>
                <textarea id="editar-flashcard-respuesta" placeholder="Escribe la respuesta o definición aquí..." required></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelar-editar-flashcard">Cancelar</button>
            <button class="btn btn-primary" id="guardar-editar-flashcard">Guardar Cambios</button>
        </div>
    </div>
</div>
