<div id="list" class="tab-content">
    <div class="flashcards-section">
        <h3>Mis Flashcards</h3>
        <div id="flashcards-container">
            {% if tarjetas %}
                <div id="flashcards-list" class="flashcards-list">
                    {% for tarjeta in tarjetas %}
                        <div class="flashcard-item" data-flashcard-id="{{ tarjeta.id }}">
                            <div class="flashcard-header">
                                <h4>{{ tarjeta.pregunta }}</h4>
                                <span class="flashcard-mazo">{{ tarjeta.mazo.nombre }}</span>
                            </div>
                            <p class="flashcard-respuesta">{{ tarjeta.respuesta }}</p>
                            {% if tarjeta.categoria %}
                                <p class="flashcard-categoria"><strong>Categoría:</strong> {{ tarjeta.categoria }}</p>
                            {% endif %}
                        </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="empty-state" id="flashcards-list-empty">
                    <i class="fas fa-inbox"></i>
                    <p>No tienes flashcards creadas todavía.</p>
                </div>
            {% endif %}
        </div>
    </div>
</div>
