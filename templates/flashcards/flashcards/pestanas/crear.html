<div id="create" class="tab-content">
    <div class="flashcards-section">
        <div class="section-header">
            <h3>Mis Flashcards</h3>
            <button class="btn btn-primary" id="btn-abrir-crear-flashcard">
                <i class="fas fa-plus-circle"></i> Crear Nueva Flashcard
            </button>
        </div>
        
        <div id="flashcards-preview">
            {% if tarjetas %}
                <div class="flashcards-table-container">
                    <table class="flashcards-table">
                        <thead>
                            <tr>
                                <th>Pregunta</th>
                                <th>Respuesta</th>
                                <th>Categoría</th>
                                <th>Mazo</th>
                                <th style="text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for tarjeta in tarjetas %}
                                <tr class="flashcard-row" data-flashcard-id="{{ tarjeta.id }}">
                                    <td class="flashcard-pregunta">{{ tarjeta.pregunta }}</td>
                                    <td class="flashcard-respuesta">{{ tarjeta.respuesta }}</td>
                                    <td class="flashcard-categoria">{{ tarjeta.categoria|default:"-" }}</td>
                                    <td class="flashcard-mazo">{{ tarjeta.mazo.nombre }}</td>
                                    <td class="flashcard-actions">
                                        <button class="btn-icon btn-editar-flashcard" data-flashcard-id="{{ tarjeta.id }}" title="Editar">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn-icon btn-eliminar-flashcard" data-flashcard-id="{{ tarjeta.id }}" title="Eliminar">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            {% else %}
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No tienes flashcards creadas todavía.</p>
                </div>
            {% endif %}
        </div>
    </div>
</div>
