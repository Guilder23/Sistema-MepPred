<!-- Modal Editar Tema -->
<div class="modal-editar-overlay" id="modalEditarOverlay">
    <div class="modal-editar-container">
        <div class="modal-editar-header">
            <h2>Editar Tema</h2>
            <button type="button" class="modal-editar-btn-close">&times;</button>
        </div>
        <form id="formEditarTema">
            <input type="hidden" id="inputIdTemaEditar">
            <div class="modal-editar-body">
                <div class="modal-editar-form-group modal-editar-required">
                    <label for="inputNombreTemaEditar">Nombre del Tema</label>
                    <input 
                        type="text" 
                        class="modal-editar-form-control" 
                        id="inputNombreTemaEditar" 
                        name="nombre" 
                        placeholder="Ej: Introducción a la Programación"
                        required
                        minlength="3"
                        maxlength="200">
                </div>
                
                <div class="modal-editar-form-group modal-editar-required">
                    <label for="selectMateriaTemaEditar">Materia</label>
                    <select 
                        class="modal-editar-form-control" 
                        id="selectMateriaTemaEditar" 
                        name="materia_id"
                        required>
                        <option value="">-- Seleccionar Materia --</option>
                    </select>
                </div>
                
                <div class="modal-editar-form-group">
                    <label for="textareaDescripcionTemaEditar">Descripción</label>
                    <textarea 
                        class="modal-editar-form-control" 
                        id="textareaDescripcionTemaEditar" 
                        name="descripcion" 
                        placeholder="Descripción opcional del tema..."
                        maxlength="500"
                        rows="4"></textarea>
                </div>
                
                <div class="modal-editar-form-group">
                    <label class="modal-editar-checkbox-label">
                        <input type="checkbox" id="checkboxSuscripcionEditar" name="requiere_suscripcion">
                        <span class="modal-editar-checkbox-text">Requiere Suscripción Premium</span>
                    </label>
                    <small class="modal-editar-form-help">Si está marcado, solo usuarios con suscripción premium podrán acceder a este tema</small>
                </div>
            </div>
            <div class="modal-editar-footer">
                <button type="button" class="modal-editar-btn modal-editar-btn-cancelar" id="btnCancelarEditarTema">Cancelar</button>
                <button type="button" class="modal-editar-btn modal-editar-btn-actualizar" id="btnActualizarTema">Actualizar</button>
            </div>
        </form>
    </div>
</div>
<div id="modalEditarOverlay" class="modal-editar-overlay">
    <div class="modal-editar-container">
        <div class="modal-editar-header">
            <h2>Editar Tema</h2>
            <button type="button" id="btnCerrarModalEditar" class="modal-editar-btn-close">&times;</button>
        </div>
        <form id="formEditarTema">
            <input type="hidden" id="inputIdTemaEditar" name="id">
            <div class="modal-editar-body">
                <div class="form-group">
                    <label for="inputNombreTemaEditar">Nombre del Tema *</label>
                    <input type="text" id="inputNombreTemaEditar" name="nombre" required placeholder="Ingresa el nombre del tema">
                </div>

                <div class="form-group">
                    <label for="selectMateriaTemaEditar">Materia *</label>
                    <select id="selectMateriaTemaEditar" name="materia_id" required>
                        <option value="">-- Seleccionar Materia --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="textareaDescripcionTemaEditar">Descripción</label>
                    <textarea id="textareaDescripcionTemaEditar" name="descripcion" placeholder="Descripción del tema (opcional)" rows="4"></textarea>
                </div>

                <div class="form-group form-check">
                    <input type="checkbox" id="checkboxSuscripcionEditar" name="suscripcion" class="form-check-input">
                    <label class="form-check-label" for="checkboxSuscripcionEditar">
                        Requiere Suscripción
                    </label>
                </div>
            </div>
            <div class="modal-editar-footer">
                <button type="button" id="btnCancelarEditar" class="modal-editar-btn modal-editar-btn-cancelar">Cancelar</button>
                <button type="submit" class="modal-editar-btn modal-editar-btn-actualizar">Actualizar</button>
            </div>
        </form>
    </div>
</div>
