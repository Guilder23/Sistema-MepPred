<!-- Modal Crear Tema -->
<div class="modal-crear-overlay" id="modalCrearOverlay">
    <div class="modal-crear-container">
        <div class="modal-crear-header">
            <h2>Crear Nuevo Tema</h2>
            <button type="button" class="modal-crear-btn-close">&times;</button>
        </div>
        <form id="formCrearTema">
            <div class="modal-crear-body">
                <div class="modal-crear-form-group modal-crear-required">
                    <label for="crearNombre">Nombre del Tema</label>
                    <input 
                        type="text" 
                        class="modal-crear-form-control" 
                        id="crearNombre" 
                        name="nombre" 
                        placeholder="Ej: Introducción a la Programación"
                        required
                        minlength="3"
                        maxlength="200">
                </div>
                
                <div class="modal-crear-form-group modal-crear-required">
                    <label for="crearMateria">Materia</label>
                    <select 
                        class="modal-crear-form-control" 
                        id="crearMateria" 
                        name="materia_id"
                        required>
                        <option value="">-- Seleccionar Materia --</option>
                    </select>
                </div>
                
                <div class="modal-crear-form-group">
                    <label for="crearDescripcion">Descripción</label>
                    <textarea 
                        class="modal-crear-form-control" 
                        id="crearDescripcion" 
                        name="descripcion" 
                        placeholder="Descripción opcional del tema..."
                        maxlength="500"
                        rows="4"></textarea>
                </div>
                
                <div class="modal-crear-form-group">
                    <label class="modal-crear-checkbox-label">
                        <input type="checkbox" id="crearRequiereSuscripcion" name="requiere_suscripcion">
                        <span class="modal-crear-checkbox-text">Requiere Suscripción Premium</span>
                    </label>
                    <small class="modal-crear-form-help">Si está marcado, solo usuarios con suscripción premium podrán acceder a este tema</small>
                </div>
            </div>
            <div class="modal-crear-footer">
                <button type="button" class="modal-crear-btn modal-crear-btn-cancelar" id="btnCancelarTema">Cancelar</button>
                <button type="button" class="modal-crear-btn modal-crear-btn-guardar" id="btnGuardarTema">Guardar</button>
            </div>
        </form>
    </div>
</div>
