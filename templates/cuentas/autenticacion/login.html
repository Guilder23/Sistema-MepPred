{% extends 'base/base.html' %}

{% block titulo %}Login{% endblock %}

{% block css %}
<link rel="stylesheet" href="/static/css/cuentas/autenticacion/login.css" />
{% endblock %}

{% block contenido %}
<section class="card">
  <h1>Iniciar sesión</h1>
  <form method="post" novalidate id="login-form">
    {% csrf_token %}
    
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input 
        type="email" 
        id="email"
        name="email" 
        placeholder="correo@ejemplo.com"
        required 
        data-next="password"
      />
      <span class="error-message" id="email-error"></span>
    </div>

    <div class="form-group password-group">
      <label for="password">Contraseña</label>
      <div class="password-wrapper">
        <input 
          type="password" 
          id="password"
          name="password" 
          placeholder="Tu contraseña"
          required 
          data-next="submit"
        />
        <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar/ocultar contraseña">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <span class="error-message" id="password-error"></span>
    </div>

    <button type="submit" id="submit">Ingresar</button>
  </form>

  <div class="links">
    <a href="/recuperar/">¿Olvidaste tu contraseña?</a>
    <a href="/verificacion/reenviar/">Reenviar verificación</a>
    <a href="/registro/">Crear cuenta</a>
  </div>
</section>
{% endblock %}

{% block js %}
<script src="/static/js/cuentas/autenticacion/login.js"></script>
{% endblock %}
