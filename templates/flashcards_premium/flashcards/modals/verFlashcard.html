<!-- Modal Ver Flashcard -->
<div class="modal-overlay" id="verFlashcardModal" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3>Detalles de la Flashcard</h3>
            <button type="button" class="btn-cerrar-modal" onclick="cerrarModal('verFlashcardModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="detalle-item">
                <label>ID:</label>
                <p id="verFlashcardId"></p>
            </div>
            <div class="detalle-item">
                <label>Mazo:</label>
                <p id="verFlashcardMazo"></p>
            </div>
            <div class="detalle-item">
                <label>Pregunta:</label>
                <p id="verFlashcardPregunta"></p>
            </div>
            <div class="detalle-item">
                <label>Respuesta:</label>
                <p id="verFlashcardRespuesta"></p>
            </div>
            <div class="detalle-item">
                <label>Categoría:</label>
                <p id="verFlashcardCategoria"></p>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cerrar" onclick="cerrarModal('verFlashcardModal')">Cerrar</button>
        </div>
    </div>
</div>
