<!-- Modal Eliminar Flashcard -->
<div class="modal-overlay" id="eliminarFlashcardModal" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3>Eliminar Flashcard</h3>
            <button type="button" class="btn-cerrar-modal" onclick="cerrarModal('eliminarFlashcardModal')">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="deleteFlashcardId">
            <div class="alerta-eliminar">
                <p><strong>⚠️ Advertencia:</strong> Esta acción no se puede deshacer.</p>
            </div>
            <div class="info-flashcard">
                <p><strong>Pregunta:</strong> <span id="deleteFlashcardPregunta"></span></p>
                <p><strong>Respuesta:</strong> <span id="deleteFlashcardRespuesta"></span></p>
            </div>
            <p>¿Está seguro que desea eliminar esta flashcard?</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancelar" onclick="cerrarModal('eliminarFlashcardModal')">Cancelar</button>
            <button type="button" class="btn-confirmar-eliminar" id="btnConfirmarEliminarFlashcard">Eliminar</button>
        </div>
    </div>
</div>
