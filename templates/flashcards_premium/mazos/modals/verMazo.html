<!-- Modal Ver Mazo -->
<div class="modal-overlay" id="verMazoModal" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3>Detalles del Mazo</h3>
            <button type="button" class="btn-cerrar-modal" onclick="cerrarModal('verMazoModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="detalle-item">
                <label>Nombre:</label>
                <p id="verNombreMazo"></p>
            </div>
            <div class="detalle-item">
                <label>Materia:</label>
                <p id="verMateriaMazo"></p>
            </div>
            <div class="detalle-item">
                <label>Descripción:</label>
                <p id="verDescripcionMazo"></p>
            </div>
            <div class="detalle-item">
                <label>Total de Flashcards:</label>
                <p id="verTotalFlashcards"></p>
            </div>
            <div class="detalle-item">
                <label>Creado:</label>
                <p id="verCreadoMazo"></p>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cerrar" onclick="cerrarModal('verMazoModal')">Cerrar</button>
        </div>
    </div>
</div>
