services:
  - type: web
    name: meetwin-app
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn meetwin.wsgi
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: "production"
      - key: ALLOWED_HOSTS
        value: "sistema-meppred-6.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sistema-meppred-6.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sistema-meppred-6.onrender.com"
